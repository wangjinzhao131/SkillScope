version = "1.0"

[task]
name = "snorkel-ai/fixture-investigate-task"

[environment]
base_image = "fixture-investigate-task:latest"
build_timeout_sec = 300.0
cpus = 4
memory = "8G"
storage = "20G"
network_mode = "public"

[verifier]
timeout_sec = 600.0
